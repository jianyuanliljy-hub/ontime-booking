name: 改进建议
description: 描述具体使用场景和期望的改进
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的具体问题
      description: 描述实际使用场景和目前的阻碍，避免填写个人入口或订单信息。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 说明期望怎样操作、看到什么结果，以及为什么有帮助。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方式
      description: 可选，说明现有功能或手动操作为什么不足以解决。

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title description">
  <title id="title">从个人锻炼页面复制入口链接</title>
  <desc id="description">操作示意：在企业微信打开智慧吉大、体育场馆预约、个人锻炼，停在尚未选择场馆的页面，再点右上角菜单复制链接。此图不是平台真实截图。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
      .title { font-size: 27px; font-weight: 700; fill: #17202b; }
      .caption { font-size: 16px; fill: #657285; }
      .heading { font-size: 20px; font-weight: 650; fill: #17202b; }
      .body { font-size: 18px; fill: #334155; }
      .small { font-size: 16px; fill: #657285; }
      .number { font-size: 18px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .arrow { font-size: 32px; fill: #9aa7b6; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1120" height="500" rx="22" fill="#f5f7fa"/>
  <text x="32" y="48" class="title">入口链接在哪里复制？</text>
  <text x="32" y="78" class="caption">操作示意 · 非平台真实截图，具体界面以你看到的为准</text>

  <rect x="30" y="106" width="330" height="319" rx="17" fill="#fff" stroke="#dce3ec"/>
  <circle cx="59" cy="139" r="16" fill="#2463db"/>
  <text x="59" y="145" class="number">1</text>
  <text x="86" y="146" class="heading">打开个人锻炼入口</text>
  <rect x="54" y="171" width="282" height="43" rx="10" fill="#eef4ff"/>
  <text x="72" y="199" class="body">企业微信 → 智慧吉大</text>
  <text x="194" y="241" class="small" text-anchor="middle">↓</text>
  <rect x="54" y="253" width="282" height="43" rx="10" fill="#f5f7fa"/>
  <text x="72" y="281" class="body">体育场馆预约</text>
  <text x="194" y="322" class="small" text-anchor="middle">↓</text>
  <rect x="54" y="334" width="282" height="43" rx="10" fill="#f5f7fa"/>
  <text x="72" y="362" class="body">个人锻炼</text>

  <text x="377" y="278" class="arrow">→</text>

  <rect x="395" y="106" width="330" height="319" rx="17" fill="#fff" stroke="#dce3ec"/>
  <circle cx="424" cy="139" r="16" fill="#2463db"/>
  <text x="424" y="145" class="number">2</text>
  <text x="451" y="146" class="heading">停在场馆选择页</text>
  <rect x="419" y="171" width="282" height="160" rx="12" fill="#f8fafc" stroke="#e1e7ef"/>
  <text x="439" y="205" class="small">场馆选择</text>
  <text x="677" y="204" class="heading" text-anchor="middle">···</text>
  <rect x="439" y="223" width="242" height="39" rx="8" fill="#fff" stroke="#e1e7ef"/>
  <text x="455" y="249" class="small">可选场馆</text>
  <rect x="439" y="273" width="242" height="39" rx="8" fill="#fff" stroke="#e1e7ef"/>
  <text x="455" y="299" class="small">其他场馆</text>
  <text x="419" y="365" class="body">先不要点选场馆或时段。</text>
  <text x="419" y="394" class="small">在这个页面复制原始入口。</text>

  <text x="742" y="278" class="arrow">→</text>

  <rect x="760" y="106" width="330" height="319" rx="17" fill="#fff" stroke="#dce3ec"/>
  <circle cx="789" cy="139" r="16" fill="#2463db"/>
  <text x="789" y="145" class="number">3</text>
  <text x="816" y="146" class="heading">右上角菜单 → 复制链接</text>
  <rect x="784" y="171" width="282" height="160" rx="12" fill="#f8fafc" stroke="#e1e7ef"/>
  <circle cx="1040" cy="198" r="15" fill="#e8f0ff" stroke="#2463db"/>
  <text x="1040" y="203" class="heading" text-anchor="middle">···</text>
  <path d="M1040 218v13" stroke="#2463db" stroke-width="2"/>
  <rect x="808" y="239" width="235" height="58" rx="10" fill="#eef4ff" stroke="#2463db"/>
  <text x="925" y="274" class="heading" text-anchor="middle">复制链接</text>
  <text x="784" y="365" class="body">稍后粘贴到电脑上的准点。</text>
  <text x="784" y="394" class="small">使用自己的完整链接。</text>

  <text x="32" y="466" class="caption">复制的是「个人锻炼」原始入口，浏览器中的场次详情地址不能代替它。</text>
</svg>
